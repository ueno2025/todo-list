<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Todo-list</title>

<body>
    <div class="todo-container">
        <h1>TODOリスト</h1>
        <div class="input-area">
            <input type="text" name="add-todo" class="todo-input" placeholder="やることを入力">
            <button class="todo-btn">追加</button>
        </div>
        <ul class="todo-list">
            <li class="todo-li">todo-1
                <button class="delete-btn"><img src="trash-2.svg" alt="削除"></button>
            </li>
            <li class="todo-li">todo-2
                <button class="delete-btn"><img src="trash-2.svg" alt="削除"></button>
            </li>
            <li class="todo-li">todo-3
                <button class="delete-btn"><img src="trash-2.svg" alt="削除"></button>
            </li>
        </ul>
    </div>

    <script src="script.js"></script>

</body>

</html>
